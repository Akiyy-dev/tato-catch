name: Publish research prerelease

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release tag and merged commit
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag differs from VERSION' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit is not merged into main' }
      - name: Verify source without client attachment
        run: python scripts/verify.py
      - name: Test archive safety and reproducibility
        run: python -m unittest discover -s tests -v
      - name: Build source probe kit
        run: python scripts/build_release.py
      - name: Publish ZIP and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/RELEASE-$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw 'Release notes missing' }
          $assets = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' | ForEach-Object FullName)
          if ($assets.Count -ne 1) { throw 'Expected one source ZIP' }
          gh release create $env:GITHUB_REF_NAME @assets dist/SHA256SUMS --verify-tag --prerelease --title "Tato Catch $env:GITHUB_REF_NAME" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
